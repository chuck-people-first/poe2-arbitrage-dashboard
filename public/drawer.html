<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PoE2 Arbitrage Dashboard — Demo Drawer</title>
  <link rel="stylesheet" href="/dashboard.css">
</head>
<body>
  <main class="shell">
    <div class="demo-banner" role="alert" style="display:flex;align-items:center;gap:10px;margin-bottom:14px;background:repeating-linear-gradient(45deg,rgba(248,113,113,.18),rgba(248,113,113,.18) 10px,rgba(248,113,113,.08) 10px,rgba(248,113,113,.08) 20px);border:2px solid rgba(248,113,113,.6);color:#ffd7d7;border-radius:10px;padding:12px 16px;font-size:14px;font-weight:700;">
      ⚠ DEMO DATA — NOT LIVE OR EXECUTABLE
    </div>
    <header class="topbar">
      <div><p class="eyebrow">POE2 CURRENCY EXCHANGE</p><h1>Actionable flips</h1><p class="subhead">Buy a specific item with one currency, then sell that same item for another. Exact integer quantities.</p></div>
      <div class="source-badge"><span class="dot"></span><div><strong>Hourly status</strong><small id="sourceAge">—</small><small id="completedAt">—</small></div></div>
    </header>
  </main>
  <aside class="drawer open" id="drawer" aria-hidden="false"><div class="drawer-inner" id="drawerInner"></div></aside>
  <div class="scrim" id="scrim"></div>
  <script src="/dashboard-demo.js"></script>
  <script src="/dashboard-data.js"></script>
  <script src="/dashboard-drawer.js"></script>
</body>
</html>
